# Kiểm thử tự động — CHỈ chạy khi có PR vào main (không chạy khi push nhánh) để tiết kiệm phút Actions
# (dùng chung hạn mức với dự án khác). Ước tính: ~1 phút / lần (cài Python + Node ~20 s, kiểm thử ~30 s).
# Chạy y hệt trên máy:  python3 tools/chay-kiem-thu.py
name: kiem-thu

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR có commit mới → hủy lần chạy cũ, không tốn phút cho bản đã cũ
  group: kiem-thu-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  kiem-thu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Chạy toàn bộ kiểm thử (unittest, kiểm ngược, kiểm khớp JS ↔ Python, quét khóa)
        env:
          DAOVANG_CAN_NODE: "1"
        run: python tools/chay-kiem-thu.py
